name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test ve EXE derleme
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Testler (çekirdek + gerçek verili ekransız arayüz)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v -s

      - name: Sürüm bilgisi
        run: |
          if ("$env:GITHUB_REF" -like "refs/tags/v*") { $v = "$env:GITHUB_REF_NAME" } else { $v = "dev-" + "$env:GITHUB_SHA".Substring(0,7) }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: EXE derle (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SentinelPC --icon assets/icon.ico
          --add-data "assets;assets"
          --version-file version_info.txt run.py

      - name: EXE açılış testi (gerçek donanım verisiyle)
        run: |
          $out = Join-Path $PWD "selftest-exe.json"
          $p = Start-Process -FilePath "dist\SentinelPC.exe" -ArgumentList "--self-test=$out" -Wait -PassThru
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Self-test başarısız (çıkış kodu $($p.ExitCode))" }

      - name: Dağıtım dosyalarını hazırla
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\SentinelPC.exe" "release\SentinelPC-$env:APP_VERSION.exe"
          $sums = Get-ChildItem release -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $sums | Out-File release\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length
          Get-Content release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SentinelPC-windows
          path: release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report
          path: selftest-*.json
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SentinelPC-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
